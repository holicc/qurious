name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The TPC-H cases are skipped unless the data is present and INCLUDE_TPCH is set, so
    # generate it here -- otherwise the whole tpch suite silently does not run.
    - name: Generate TPC-H data
      run: make tpch-data

    - name: Run tests
      run: cargo test
      env:
        INCLUDE_TPCH: "true"

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
