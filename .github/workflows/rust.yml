name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    # A deadlock or runaway query hangs the job rather than failing it, and the default is six
    # hours. Fail fast instead: the suite takes a few minutes including TPC-H data generation.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    # The TPC-H cases are skipped unless the data is present and INCLUDE_TPCH is set, so
    # generate it here -- otherwise the whole tpch suite silently does not run.
    - name: Generate TPC-H data
      run: make tpch-data

    - name: Run tests
      run: cargo test
      env:
        INCLUDE_TPCH: "true"

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all --check

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
